name: Hapoel Updates Timer

on:
  schedule:
    - cron: '*/45 * * * *' 
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (Winner odds scraping)
        run: python -m playwright install --with-deps chromium

      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python bot.py

      - name: Save changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_links.txt task_log.txt recent_summaries.txt schedule.json gemini_usage.txt subscribers.txt telegram_offset.txt
          # קבצים אופציונליים — מוסיפים כל אחד בנפרד כדי שקובץ חסר אחד לא יכשיל את כל ה-add
          for f in history_facts.txt one_api_failed.flag gemini_last_alert.txt squad_snapshot.json weekly_squad_changes.json odds_opening.json; do
            git add "$f" 2>/dev/null || true
          done
          git commit -m "Update history [skip ci]" || echo "No changes to commit"
          git push origin main
